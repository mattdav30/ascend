<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070A12">
<title>Ascend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+Runic&display=swap">
<style>
/* Layout: one-screen phone app. Fixed header, scrolling tab body, rune tab bar. Dark arcane HUD, single committed look. */
:root{
  color-scheme:dark;
  --bg:#070A12;
  --panel:#0E1322;
  --panel2:#121A2E;
  --line:#1F2A44;
  --line2:#2A3858;
  --fg:#E8EEFA;
  --muted:#8F9BB3;
  --dim:#5D6A85;
  --accent:#4C8DFF;
  --accent2:#8DB8FF;
  --accentDeep:#1E3F86;
  --ink:#04112B;
  --gold:#F5B841;
  --danger:#FF8A7A;
  --good:#3DDC97;
  --f-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-rune:'Noto Sans Runic','Segoe UI Historic','Segoe UI Symbol',sans-serif;
  --f-mix:'Chakra Petch','Noto Sans Runic','Segoe UI Historic',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;transition:transform .12s ease,box-shadow .25s ease,background-color .25s ease,border-color .25s ease,opacity .2s}
button:active:not(:disabled){transform:scale(.95)}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
.rune{font-family:var(--f-rune);font-weight:400}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 60% at 50% 0%,#0F1A33 0%,var(--bg) 60%)}
#rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
@keyframes drift{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}

/* header */
.top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line);background:rgba(7,10,18,.72);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex-shrink:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.24em}
.topR{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip .rune{color:var(--gold);font-size:15px}
.iconBtn{position:relative;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconBtn:hover{color:var(--fg);background:var(--panel)}
.badge{position:absolute;top:6px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--ink);font-size:10.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 10px var(--accent)}

/* body */
main{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;padding-block:14px 28px;padding-inline:16px;scroll-behavior:smooth}
.tab{display:flex;flex-direction:column;gap:14px}
.tab[hidden]{display:none!important}
.tabIn{animation:tabIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes tabIn{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.stag>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.stag>*:nth-child(2){animation-delay:.05s}.stag>*:nth-child(3){animation-delay:.1s}.stag>*:nth-child(4){animation-delay:.15s}.stag>*:nth-child(5){animation-delay:.2s}.stag>*:nth-child(6){animation-delay:.25s}.stag>*:nth-child(7){animation-delay:.3s}.stag>*:nth-child(8){animation-delay:.35s}.stag>*:nth-child(n+9){animation-delay:.4s}
@keyframes up{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}

.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.panel.glow{border-color:var(--accent);box-shadow:0 0 0 1px rgba(76,141,255,.15),0 0 28px -10px var(--accent)}
.h2{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px}
.h2 .rune{color:var(--accent);letter-spacing:0;font-size:15px}
.h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:14px;letter-spacing:.02em;position:relative;overflow:hidden}
.btn.pri{background:var(--accent);color:var(--ink);box-shadow:0 0 22px -6px var(--accent)}
.btn.pri:hover{box-shadow:0 0 28px -2px var(--accent)}
.btn.sec{border:1px solid var(--accent);color:var(--accent2)}
.btn.ghost{border:1px solid var(--line2);color:var(--fg)}
.btn.sm{min-height:44px;padding:0 12px;font-size:13px}
.btn.full{width:100%}
.shimmer::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-150%);animation:shim 2.8s ease-in-out infinite;pointer-events:none}
@keyframes shim{to{transform:translateX(350%)}}
.bar{position:relative;height:10px;background:#18213A;border-radius:999px;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,var(--accentDeep),var(--accent));box-shadow:0 0 12px var(--accent);transition:width .9s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.bar>i::after{content:"";position:absolute;inset:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shim 2.6s ease-in-out infinite}
.bar.thin{height:6px}
.bar.gold>i{background:linear-gradient(90deg,#8A5A10,var(--gold));box-shadow:0 0 10px var(--gold)}

/* hero stage */
.stage{position:relative;height:420px;border-radius:22px;overflow:hidden;border:1px solid #23325A;background:rgba(10,16,32,.55)}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(76,141,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(76,141,255,.07) 1px,transparent 1px);background-size:26px 26px;animation:grid 4s linear infinite;mask-image:radial-gradient(80% 70% at 50% 60%,#000,transparent)}
@keyframes grid{to{background-position:0 26px,26px 0}}
.stage::after{content:"";position:absolute;left:0;right:0;top:-30%;height:30%;background:linear-gradient(180deg,transparent,rgba(76,141,255,.13),transparent);animation:scan 4.5s linear infinite;pointer-events:none}
@keyframes scan{to{top:110%}}
#stage3d{position:absolute;inset:0;touch-action:pan-y;cursor:grab}
#stage3d:active{cursor:grabbing}
#stage3d canvas{display:block;width:100%!important;height:100%!important}
.stageFail{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.hud{position:absolute;z-index:2;pointer-events:none}
.hud.tl{top:14px;left:14px}
.hud.tr{top:10px;right:10px;pointer-events:auto}
.hud.bl{left:14px;right:14px;bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.hud small{display:block;font-size:10px;letter-spacing:.3em;color:var(--muted)}
.hud .pow{font-family:var(--f-display);font-weight:700;font-size:24px;color:var(--accent2);text-shadow:0 0 14px var(--accent)}
.form{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.14em;color:var(--fg);text-shadow:0 0 16px var(--accent)}
.clsTag{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:rgba(7,10,18,.75);border:1px solid var(--line2);font-size:12px;font-weight:600;letter-spacing:.08em}
.clsTag .rune{color:var(--accent2);font-size:16px}
.dragHint{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;color:var(--muted);pointer-events:none;animation:hint 3.5s ease 1s both}
@keyframes hint{0%,70%{opacity:1}100%{opacity:0}}

.ident{display:flex;align-items:center;gap:12px}
.ident .lvl{text-align:right}
.ident .lvl b{display:block;font-family:var(--f-display);font-size:40px;line-height:1}
.name{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.06em}
.rankLine{font-size:12px;font-weight:600;letter-spacing:.16em;color:var(--accent2)}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1}
.stat .k{font-size:11px;letter-spacing:.2em;color:var(--muted)}
.stat .rune{color:var(--accent2);font-size:20px}
.plus{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--ink);font-size:22px;font-weight:700;box-shadow:0 0 18px -4px var(--accent);animation:pulseRing 2s ease-in-out infinite}
@keyframes pulseRing{50%{box-shadow:0 0 26px 2px var(--accent)}}
.ptsBanner{border:1px solid var(--accent);border-radius:14px;padding:12px 14px;color:var(--accent2);font-weight:600;animation:pulseRing 2.2s ease-in-out infinite}

.body3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv{background:var(--panel2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv small{font-size:10.5px;letter-spacing:.18em;color:var(--muted)}
.kv b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.link{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:64px}
.link:hover{border-color:var(--line2)}
.link .rune{font-size:26px;color:var(--accent2);width:32px;text-align:center;text-shadow:0 0 12px var(--accent)}
.link .t{flex:1;min-width:0}
.link .t b{display:block;font-size:15px}
.chev{color:var(--dim)}

.sample{display:flex;flex-direction:column;gap:10px;border:1px dashed var(--accent);border-radius:14px;padding:12px 14px;background:rgba(76,141,255,.06);font-size:13.5px}

/* quests */
.chapter{overflow:hidden;background:linear-gradient(150deg,#13234A 0%,var(--panel) 65%);border-color:var(--accent)}
.chapter .bigRune{position:absolute;right:-14px;top:-26px;font-size:120px;color:rgba(76,141,255,.14);animation:spin 30s linear infinite;line-height:1}
@keyframes spin{to{transform:rotate(360deg)}}
.q{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;position:relative;overflow:hidden;transition:border-color .4s}
.q.ready{border-color:var(--accent);box-shadow:0 0 22px -10px var(--accent)}
.q.done{opacity:.62}
.q .qr{width:40px;height:40px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--panel2);color:var(--accent2);border:1px solid var(--line2)}
.q.ready .qr{animation:runeGlow 1.8s ease-in-out infinite}
@keyframes runeGlow{50%{box-shadow:0 0 18px var(--accent);color:#fff}}
.q .qt{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.q .qt b{font-size:14.5px}
.q .meta{font-size:12px;color:var(--muted)}
.rew{color:var(--accent2);font-weight:600}
.rew .rune{color:var(--gold)}
.claimBtn{min-width:78px}
.okTag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--good);min-width:78px;justify-content:center}
.resetT{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-weight:500;font-size:12px;color:var(--dim)}
.logItem{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.logItem:first-child{border-top:0}
.logItem .rune{font-size:18px;color:var(--accent2);width:24px;text-align:center}
.logItem .t{flex:1;min-width:0}
.logItem .t b{display:block;font-size:14px}
.xpTag{font-family:var(--f-display);font-weight:700;color:var(--accent2);white-space:nowrap}
.x{width:44px;height:44px;border-radius:10px;color:var(--dim);display:grid;place-items:center;flex-shrink:0}
.x:hover{color:var(--danger)}

/* run */
.mapPanel{padding:0;overflow:hidden}
#map{display:block;width:100%;height:280px;background:radial-gradient(90% 80% at 50% 50%,#0F1A33 0%,#080C17 100%)}
.mapTop{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.mapTop span{font-size:12px;color:var(--muted);background:rgba(7,10,18,.7);padding:4px 8px;border-radius:8px}
.live{color:var(--danger)!important;font-weight:700;letter-spacing:.14em}
.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.hudRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.hudRow div{padding:12px 6px;text-align:center;border-left:1px solid var(--line);min-width:0}
.hudRow div:first-child{border-left:0}
.hudRow b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hudRow small{font-size:10px;letter-spacing:.18em;color:var(--muted)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.ctrls .btn{flex:1 1 120px}
.gpsMsg{border:1px solid var(--gold);background:rgba(245,184,65,.07);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.runCard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.runCard.sel{border-color:var(--accent)}
.runCard canvas{width:72px;height:56px;border-radius:10px;background:#0A1020;flex-shrink:0}
.runCard .t{flex:1;min-width:0}
.runCard .t b{display:block}

/* fuel */
.fuelTop{display:flex;align-items:center;gap:16px}
.ringBox{position:relative;width:140px;height:140px;flex-shrink:0}
.ringBox svg{position:absolute;inset:0}
.ringBox .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringBox .c b{font-family:var(--f-display);font-size:30px;line-height:1}
#kcalArc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px var(--gold))}
.macro{display:flex;flex-direction:column;gap:4px}
.macro .between{font-size:12.5px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.favs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.fav{flex-shrink:0;min-height:58px;padding:8px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);text-align:left}
.fav b{display:block;font-size:14px}
.fav:hover{border-color:var(--accent)}

/* glyphs */
.sigilWrap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;overflow:hidden;background:radial-gradient(70% 70% at 50% 40%,#142650 0%,var(--panel) 70%)}
.sigilBtn{position:relative;width:190px;height:190px;border-radius:50%;touch-action:none;user-select:none;-webkit-user-select:none}
.sigilBtn svg{position:absolute;inset:0;overflow:visible}
.sigilBtn .core{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-rune);font-size:72px;color:var(--accent2);text-shadow:0 0 22px var(--accent);transition:transform .3s,color .3s}
.sigilBtn.charging .core{transform:scale(1.15);color:#fff;animation:shake .12s linear infinite}
@keyframes shake{25%{translate:1px -1px}75%{translate:-1px 1px}}
.sigilBtn.lit .core{color:#fff;text-shadow:0 0 30px var(--accent),0 0 60px var(--accent)}
.spinA{animation:spin 18s linear infinite;transform-origin:95px 95px}
.spinB{animation:spin 26s linear infinite reverse;transform-origin:95px 95px}
.charging .spinA{animation-duration:1.4s}
.charging .spinB{animation-duration:2s}
#sigilProg{transition:stroke-dashoffset .3s}
.shards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.shard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.shard .rune{font-size:24px;color:var(--gold);text-shadow:0 0 12px rgba(245,184,65,.6)}
.shard b{font-family:var(--f-display);font-size:20px}
.shard small{font-size:10px;letter-spacing:.18em;color:var(--muted)}
.slots{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.slot{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:1px dashed var(--line2);color:var(--dim);font-size:11px}
.slot.on{border:1px solid var(--accent);color:#fff;box-shadow:0 0 20px -4px var(--accent)}
.slot.on .rune{font-size:30px;text-shadow:0 0 14px var(--accent)}
.slot.on::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px dashed var(--accent);animation:spin 8s linear infinite;opacity:.7}
.slot.lock{opacity:.45}
.codex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gcard{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gcard .big{font-size:40px;line-height:1;color:var(--dim)}
.gcard.awake .big{color:var(--accent2);text-shadow:0 0 18px var(--accent)}
.gcard.equip{border-color:var(--accent);box-shadow:0 0 24px -10px var(--accent)}
.gcard.equip .big{animation:runeFloat 3s ease-in-out infinite}
@keyframes runeFloat{50%{transform:translateY(-4px);text-shadow:0 0 26px var(--accent)}}
.gcard b{font-size:14.5px}
.gcard .fx{font-size:12.5px;color:var(--muted);flex:1}
.cost{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.cost span{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:7px;background:var(--panel2)}
.cost span.no{color:var(--danger)}
.cost .rune{color:var(--gold)}
.school{position:absolute;top:10px;right:10px;font-size:10px;letter-spacing:.16em;color:var(--muted)}

/* nav */
nav{position:relative;z-index:3;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);background:rgba(9,13,24,.92);backdrop-filter:blur(10px);padding:6px 6px 8px}
nav button{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim);font-size:10.5px;font-weight:700;letter-spacing:.14em;border-radius:12px}
nav button .rune{font-size:22px;line-height:1.1;transition:transform .35s cubic-bezier(.2,.8,.2,1),text-shadow .3s}
nav button[aria-current="page"]{color:var(--accent2)}
nav button[aria-current="page"] .rune{transform:translateY(-3px) scale(1.2);text-shadow:0 0 14px var(--accent);color:#fff}
nav button i{width:0;height:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);transition:width .3s}
nav button[aria-current="page"] i{width:20px}

/* sheet */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(3,5,10,.6);opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:88%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 60px -20px rgba(76,141,255,.35)}
.sheet.short{max-height:56%}
.sheet.open{transform:none}
.sheetHead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 6px 18px;border-bottom:1px solid var(--line)}
.sheetHead h2{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase}
.sheetBody{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.grab{width:44px;height:4px;border-radius:2px;background:var(--line2);margin:8px auto 0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.lbl{font-size:11.5px;letter-spacing:.18em;color:var(--muted);font-weight:600;text-transform:uppercase}
.inp{height:46px;border-radius:10px;border:1px solid var(--line2);background:#0A0F1C;padding:0 12px;font-size:15px;width:100%;min-width:0}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.inp::placeholder{color:var(--dim)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills label{position:relative}
.pills input{position:absolute;opacity:0;width:1px;height:1px}
.pills span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;font-weight:600;color:#C5CEDD;cursor:pointer;transition:all .2s}
.pills input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--ink);box-shadow:0 0 16px -4px var(--accent)}
.pills input:focus-visible+span{outline:2px solid var(--accent2);outline-offset:2px}
.sw span{width:44px;height:44px;padding:0;border-radius:50%;border:2px solid var(--line2)}
.sw input:checked+span{border:3px solid #fff;box-shadow:0 0 0 2px var(--accent),0 0 16px var(--accent)}
.clsGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.clsGrid label{position:relative}
.clsGrid input{position:absolute;opacity:0}
.clsGrid .card{display:flex;flex-direction:column;gap:4px;height:100%;padding:12px;border-radius:14px;border:1px solid var(--line2);cursor:pointer;transition:all .2s}
.clsGrid .card .rune{font-size:28px;color:var(--accent2)}
.clsGrid .card b{font-family:var(--f-display);letter-spacing:.08em}
.clsGrid .card small{color:var(--muted);font-size:12px}
.clsGrid input:checked+.card{border-color:var(--accent);background:rgba(76,141,255,.1);box-shadow:0 0 22px -8px var(--accent)}
.clsGrid input:focus-visible+.card{outline:2px solid var(--accent2);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.preview{display:flex;justify-content:space-between;align-items:center;border:1px dashed var(--accent);border-radius:12px;padding:12px;animation:pulseRing 2.4s ease-in-out infinite}
.preview b{font-family:var(--f-display);font-size:17px;color:var(--accent2)}
.err{color:var(--danger);font-size:13px}
.note{font-size:12.5px;color:var(--muted)}
.ach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ach div{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ach .rune{font-size:26px;color:var(--dim)}
.ach .on{border-color:var(--accent);background:rgba(76,141,255,.07)}
.ach .on .rune{color:var(--accent2);text-shadow:0 0 14px var(--accent)}
.ach small{font-size:12px;color:var(--muted)}
.ach em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--accent2)}
.tier{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px}
.tier .rune{font-size:24px;width:28px;text-align:center;color:var(--dim)}
.tier.cur{border-color:var(--accent);background:rgba(76,141,255,.08);box-shadow:0 0 24px -10px var(--accent)}
.tier.cur .rune,.tier.past .rune{color:var(--accent2)}
.tier .t{flex:1;min-width:0}
.notif{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.notif:first-child{border-top:0}
.notif .rune{font-size:22px;width:30px;text-align:center;color:var(--accent2)}
.notif.unread b::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle;box-shadow:0 0 8px var(--accent)}
.notif .t{flex:1;min-width:0}

/* toast + floaters */
#toast{position:absolute;z-index:30;top:10px;left:12px;right:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(14,19,34,.96);border:1px solid var(--accent);box-shadow:0 10px 40px -10px var(--accent);animation:toastIn .45s cubic-bezier(.2,.8,.2,1) both;pointer-events:auto}
.toast.out{animation:toastOut .35s ease-in both}
.toast .rune{font-size:24px;color:var(--accent2);text-shadow:0 0 12px var(--accent)}
.toast b{display:block;font-size:14px}
.toast small{color:var(--muted);font-size:12.5px}
@keyframes toastIn{from{transform:translateY(-120%);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(-120%);opacity:0}}
#floaters{position:absolute;z-index:25;left:0;right:0;top:120px;height:0;pointer-events:none}
.floater{position:absolute;left:50%;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap;animation:floatUp 1.7s cubic-bezier(.2,.8,.2,1) both}
.floater b{display:block;font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--accent2);text-shadow:0 0 18px var(--accent)}
.floater span{font-family:var(--f-mix);font-size:18px;color:var(--gold);text-shadow:0 0 12px rgba(245,184,65,.8)}
@keyframes floatUp{0%{transform:translate(-50%,24px) scale(.5);opacity:0}18%{transform:translate(-50%,0) scale(1.2);opacity:1}100%{transform:translate(-50%,-120px) scale(1);opacity:0}}

/* overlay: ascension sequence */
.ov{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(2,4,9,.92);overflow:hidden;--seq:#4C8DFF;--seq2:#8DB8FF}
.ov.gold{--seq:#F5B841;--seq2:#FFE7A8}
.ov.seq{animation:fadeIn .25s both}
@keyframes fadeIn{from{opacity:0}}
#ovFx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
.ovFlash{position:absolute;inset:0;background:#DCE8FF;opacity:0;pointer-events:none}
.ov.gold .ovFlash{background:#FFF1CC}
.ov.reveal .ovFlash{animation:flash .9s ease-out both}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.ovCircle{position:absolute;left:50%;top:50%;width:440px;height:440px;margin:-220px 0 0 -220px;pointer-events:none;stroke:var(--seq);fill:none;filter:drop-shadow(0 0 6px var(--seq))}
.ovCircle .d{stroke-dasharray:1;stroke-dashoffset:1}
.ov.seq .ovCircle .d{animation:draw .9s cubic-bezier(.6,0,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.ovCircle .t{fill:var(--seq2);stroke:none;opacity:0}
.ovCircle .t.g{fill:var(--seq)}
.ov.seq .ovCircle .t{animation:tIn .5s ease var(--d,1s) forwards}
@keyframes tIn{to{opacity:1}}
.ovCircle .rotA{transform-origin:220px 220px;animation:spin 16s linear infinite}
.ovCircle .rotB{transform-origin:220px 220px;animation:spin 11s linear infinite reverse}
.ov.reveal .ovCircle{animation:circleKick 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes circleKick{0%{transform:scale(1)}25%{transform:scale(1.12)}100%{transform:scale(1.04);opacity:.55}}
.ovCard{position:relative;width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:26px 22px 22px;border-radius:24px;border:2px solid var(--seq);background:radial-gradient(circle at 50% 18%,rgba(32,56,110,.96) 0%,rgba(14,19,34,.97) 70%);box-shadow:0 0 50px -6px var(--seq);opacity:0;pointer-events:none}
.ov.reveal .ovCard{pointer-events:auto;animation:cardIn .65s cubic-bezier(.2,.8,.2,1) .1s both,cardGlow 2.2s ease-in-out .8s infinite}
@keyframes cardIn{0%{transform:scale(.4) rotateX(60deg);opacity:0;filter:blur(8px)}70%{transform:scale(1.05);opacity:1;filter:none}100%{transform:none;opacity:1}}
@keyframes cardGlow{0%,100%{opacity:1}50%{box-shadow:0 0 80px 4px var(--seq);opacity:1}}
.ovCenter{position:relative;width:140px;height:140px;display:grid;place-items:center}
.ovCenter .burst{position:absolute;inset:15px;border-radius:50%;border:2px solid var(--seq);opacity:0}
.ov.reveal .burst{animation:burst 1.8s ease-out infinite}
.ov.reveal .burst:nth-child(2){animation-delay:.6s}
.ov.reveal .burst:nth-child(3){animation-delay:1.2s}
@keyframes burst{from{transform:scale(.3);opacity:.95}to{transform:scale(2.4);opacity:0}}
.ovCenter .core{position:relative;font-family:var(--f-mix);font-weight:700;font-size:64px;color:#fff;text-shadow:0 0 20px var(--seq),0 0 40px var(--seq);font-variant-numeric:tabular-nums}
.ovCenter .core.rune{font-family:var(--f-rune);font-size:78px}
.ov.reveal .core{animation:pop .6s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:none}}
.ovCenter canvas{position:relative;width:200px;height:130px}
.ovKicker{font-size:12px;font-weight:700;letter-spacing:.4em;color:var(--seq2)}
.ov.reveal .ovKicker{animation:glitch 2.6s steps(1) infinite}
@keyframes glitch{0%,82%,100%{text-shadow:none;transform:none}84%{text-shadow:-3px 0 #FF3D7F,3px 0 #38BDF8;transform:translateX(2px) skewX(-10deg)}87%{text-shadow:3px 0 #FF3D7F,-3px 0 #38BDF8;transform:translateX(-2px)}90%{text-shadow:none;transform:none}}
#ovTitle{font-family:var(--f-mix);font-weight:700;font-size:28px;letter-spacing:.1em;min-height:40px;text-wrap:balance}
#ovBody{color:#C5CEDD;font-size:14.5px;max-width:30ch}
.ov .btn.pri{background:var(--seq);box-shadow:0 0 22px -6px var(--seq)}
.ovStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.ovStats div{background:rgba(7,10,18,.5);border-radius:10px;padding:8px 4px}
.ovStats b{display:block;font-family:var(--f-display);font-size:18px}
.ovStats small{font-size:10px;letter-spacing:.16em;color:var(--muted)}
.spark{position:absolute;left:50%;top:14px;font-family:var(--f-rune);font-size:14px;color:var(--accent2);text-shadow:0 0 8px var(--accent);animation:spark .9s ease-out both}
@keyframes spark{from{transform:translate(-50%,0) scale(1.3);opacity:1}to{transform:translate(calc(-50% + var(--dx)),var(--dy)) scale(.4);opacity:0}}
.decoding{color:var(--accent2);text-shadow:0 0 12px var(--accent)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:521px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <canvas id="rain" aria-hidden="true"></canvas>

  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="-15 -15 30 30" aria-hidden="true">
        <circle r="13" fill="none" stroke="#4C8DFF" stroke-width="1.4" stroke-dasharray="3 4"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></circle>
        <path d="M-7 7 L0 -8 L7 7 M-4 2 H4" fill="none" stroke="#8DB8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <b>ASCEND</b>
    </div>
    <div class="topR">
      <span class="chip" id="streakChip" title="Training streak"></span>
      <button class="iconBtn" data-act="notifs" aria-label="Notifications" id="bellBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge" id="bellBadge" hidden></span>
      </button>
      <button class="iconBtn" data-act="settings" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="tab" id="tab-hero" aria-label="Hero">
      <div class="stage">
        <div id="stage3d" aria-label="Your 3D character. Drag sideways to rotate." role="img"></div>
        <div class="hud tl"><small>POWER</small><span class="pow num" id="hudPow">0</span></div>
        <div class="hud tr"><button class="btn sm ghost" data-act="customise" style="background:rgba(7,10,18,.7)"><span class="rune" style="color:var(--accent2);font-size:16px">ᛗ</span>Customise</button></div>
        <div class="hud bl"><div><small>FORM</small><span class="form" id="hudForm"></span></div><span class="clsTag" id="hudClass"></span></div>
        <span class="dragHint" aria-hidden="true">DRAG TO ROTATE</span>
      </div>
      <div id="heroDyn" class="tab"></div>
    </section>

    <section class="tab" id="tab-quests" aria-label="Quests" hidden><div id="questDyn" class="tab"></div></section>

    <section class="tab" id="tab-run" aria-label="Run" hidden>
      <div class="between"><h1 class="h1">Run</h1><span class="sub" id="runSub"></span></div>
      <section class="panel mapPanel">
        <canvas id="map" aria-label="Run route map"></canvas>
        <div class="mapTop"><span id="mapLabel">No run selected</span><span id="mapState" hidden></span></div>
        <div class="hudRow">
          <div><b id="hKm">0.00</b><small>KM</small></div>
          <div><b id="hTime">0:00</b><small>TIME</small></div>
          <div><b id="hPace">--</b><small>PACE</small></div>
          <div><b id="hKcal">0</b><small>KCAL</small></div>
        </div>
      </section>
      <div class="gpsMsg" id="gpsMsg" hidden></div>
      <div class="ctrls" id="runCtrls"></div>
      <input type="file" id="gpxIn" accept=".gpx,application/gpx+xml,application/xml,text/xml" class="sr" tabindex="-1" aria-hidden="true">
      <div id="runDyn" class="tab"></div>
    </section>

    <section class="tab" id="tab-fuel" aria-label="Fuel" hidden><div id="fuelDyn" class="tab"></div></section>

    <section class="tab" id="tab-glyphs" aria-label="Glyphs" hidden><div id="glyphDyn" class="tab"></div></section>
  </main>

  <nav aria-label="Sections">
    <button data-act="tab" data-tab="hero" aria-current="page"><span class="rune" aria-hidden="true">ᛗ</span>HERO<i></i></button>
    <button data-act="tab" data-tab="quests"><span class="rune" aria-hidden="true">ᛏ</span>QUESTS<i></i></button>
    <button data-act="tab" data-tab="run"><span class="rune" aria-hidden="true">ᚱ</span>RUN<i></i></button>
    <button data-act="tab" data-tab="fuel"><span class="rune" aria-hidden="true">ᚠ</span>FUEL<i></i></button>
    <button data-act="tab" data-tab="glyphs"><span class="rune" aria-hidden="true">ᛟ</span>GLYPHS<i></i></button>
  </nav>

  <div id="floaters" aria-live="polite"></div>
  <div id="toast" aria-live="polite"></div>

  <div class="scrim" id="scrim" hidden data-act="closeSheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="grab" aria-hidden="true"></div>
    <div class="sheetHead"><h2 id="sheetTitle"></h2><button class="iconBtn" data-act="closeSheet" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="sheetBody" id="sheetBody"></div>
  </div>

  <div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovTitle" hidden>
    <div class="ovFlash"></div>
    <canvas id="ovFx" aria-hidden="true"></canvas>
    <svg class="ovCircle" viewBox="0 0 440 440" aria-hidden="true">
      <defs>
        <path id="ovPathA" d="M 34 220 A 186 186 0 1 1 406 220 A 186 186 0 1 1 34 220"/>
        <path id="ovPathB" d="M 332 220 A 112 112 0 1 0 108 220 A 112 112 0 1 0 332 220"/>
      </defs>
      <g class="rotA">
        <circle class="d" pathLength="1" cx="220" cy="220" r="210" fill="none" stroke-width="2.5" style="--d:.35s"/>
        <circle class="d" pathLength="1" cx="220" cy="220" r="170" fill="none" stroke-width="1.2" style="--d:.5s"/>
        <text class="t" font-family="Noto Sans Runic, sans-serif" font-size="17" letter-spacing="8" style="--d:1s"><textPath href="#ovPathA">ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ</textPath></text>
      </g>
      <g class="rotB">
        <polygon class="d" pathLength="1" points="220,62 357,299 83,299" fill="none" stroke-width="1.6" style="--d:.7s"/>
        <polygon class="d" pathLength="1" points="220,378 357,141 83,141" fill="none" stroke-width="1.6" style="--d:.85s"/>
        <circle class="d" pathLength="1" cx="220" cy="220" r="128" fill="none" stroke-width="1" stroke-dasharray="1" style="--d:.95s"/>

function migrate(x){const b=blank();if(!x||typeof x!=='object')return b;for(const k in b){if(x[k]===undefined)x[k]=b[k];}for(const k of['profile','avatar','totals','settings','shards','stats']){x[k]=Object.assign({},b[k],x[k]);}return x;}

/* ============ game logic ============ */
function targets(){
  const p=S.profile;const w=+p.weight||75,h=+p.height||175,a=+p.age||30;
  const bmr=10*w+6.25*h-5*a+(p.sex==='f'?-161:5);let kcal=bmr*1.5;
  if(p.goal==='lose')kcal-=450;if(p.goal==='gain')kcal+=300;kcal=Math.round(kcal/10)*10;
  const prot=Math.round(w*(p.goal==='lose'?2.1:1.8));const fat=Math.round(kcal*.27/9);const carb=Math.max(50,Math.round((kcal-prot*4-fat*9)/4));
  return {kcal,p:prot,c:carb,f:fat,bmr:Math.round(bmr)};
}
const todays=a=>{const k=dayKey();return a.filter(x=>dk(x.ts)===k);};
const thisWeek=a=>{const k=weekKey();return a.filter(x=>wk(x.ts)===k);};
function nutrition(){return todays(S.meals).reduce((a,m)=>({kcal:a.kcal+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{kcal:0,p:0,c:0,f:0});}
function burned(){return todays(S.workouts).reduce((a,w)=>a+(w.kcal||0),0)+todays(S.runs).reduce((a,r)=>a+(r.kcal||0),0);}
function displayStreak(){if(!S.lastActive)return 0;const y=dayKey(shiftDay(-1)),y2=dayKey(shiftDay(-2));if(S.lastActive===dayKey()||S.lastActive===y)return S.streak;if(S.lastActive===y2&&hasGlyph('algiz'))return S.streak;return 0;}
function touchStreak(){
  const today=dayKey();if(S.lastActive===today)return;
  const y=dayKey(shiftDay(-1)),y2=dayKey(shiftDay(-2));
  if(S.lastActive===y)S.streak++;
  else if(S.lastActive===y2&&hasGlyph('algiz')){S.streak++;notify('ᛉ','Ward held','Algiz protected your streak through a missed day.');}
  else S.streak=1;
  S.lastActive=today;S.bestStreak=Math.max(S.bestStreak,S.streak);
}
function xpMult(kind,ctx={}){
  const cb=CLASSES[S.profile.cls].bonus;let m=1+(cb[kind]||0)+(cb.all||0);
  for(const id of S.equipped){const g=GL[id];if(!g)continue;const fx=g.fx;
    if(fx.xp)m+=(fx.xp[kind]||0)+(fx.xp.all||0);
    if(fx.longRun&&kind==='run'&&(ctx.km||0)>=5)m+=fx.longRun;
    if(fx.dawn&&kind!=='meal'&&new Date().getHours()<9)m+=fx.dawn;}
  return m;
}
function workoutCalc(f){
  const c=CATS[f.cat]||CATS.str,it=INT[f.intensity]||INT.mod;const minutes=Math.max(0,Math.min(600,Math.round(+f.minutes||0)));
  const xp=Math.round(minutes*it.mult*xpMult(f.cat));
  const kcal=Math.round(c.met*it.met*(+S.profile.weight||75)*minutes/60);
  const stats={[c.stat]:f.intensity==='hard'?2:1};
  for(const id of S.equipped){const st=GL[id]&&GL[id].fx.stat;if(st&&st[f.cat])stats[st[f.cat]]=(stats[st[f.cat]]||0)+1;}
  const shards={[c.stat]:1+Math.floor(minutes/15)};
  return {minutes,xp,kcal,stats,shards,c,it};
}

const OQ=[];let ovOpen=false;
function award({xp=0,shards={},stats={},quiet=false}){
  const before={level:S.level,rank:rankIdx(S.level)};
  shards=Object.assign({},shards);
  if(hasGlyph('gebo'))for(const k in shards)if(shards[k]>0)shards[k]+=1;
  for(const k in shards)S.shards[k]=(S.shards[k]||0)+shards[k];
  for(const k in stats)S.stats[k]=(S.stats[k]||0)+stats[k];
  S.xp+=xp;
  while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;S.points+=3;}
  if(!quiet){const sh=Object.entries(shards).filter(e=>e[1]>0).map(([k,v])=>'+'+v+' '+STAT[k].rune).join('  ');floater(xp?'+'+fmtN(xp)+' XP':'',sh);}
  if(S.level>before.level){
    const ri=rankIdx(S.level),gained=(S.level-before.level)*3;
    if(ri>before.rank){const t=TIERS[ri];queueOverlay({type:'rank',rune:t.rune,kicker:'RANK UP',title:t.name.toUpperCase()+' RANK',body:'You evolved into '+t.form+'. '+t.unlock+'. +'+gained+' stat points.'});notify(t.rune,'Rank up',t.name+' rank reached. '+t.unlock+'.');}
    else{queueOverlay({type:'level',num:S.level,kicker:'LEVEL UP',title:'LEVEL '+S.level,body:'Your hero grows stronger. +'+gained+' stat points to assign.'});notify('ᛏ','Level '+S.level,'You gained '+gained+' stat points.');}
    Hero3D.celebrate();
  }
  checkAchievements();commit();
}
function checkAchievements(){

/* ============ glyph rain + converge engine ============ */
function makeRain(cv,{base=.2,fs=16}={}){
  const g=cv.getContext('2d');let W=0,H=0,cols=[],last=0,running=false,gold=false;
  let sv=base,sFrom=base,sTo=base,sT0=0,sDur=1;const P=[];let pState=null;
  const rr=()=>Math.random()*24|0;
  const mk=x=>{const len=6+(Math.random()*18|0);return {x,y:-Math.random()*H*1.3,v:38+Math.random()*80,len,ch:Array.from({length:len},rr)};};
  function size(){const r=cv.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;if(!W||!H)return;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0);const n=Math.ceil(W/fs);cols=Array.from({length:n},(_,i)=>{const c=mk(i*fs+fs/2);c.y=Math.random()*H*1.3-H*.3;return c;});}
  function frame(ts){
    if(!running)return;requestAnimationFrame(frame);if(document.hidden)return;
    const dt=Math.min(.05,(ts-(last||ts))/1000);last=ts;if(!W){size();if(!W)return;}
    const k=Math.min(1,(ts-sT0)/sDur);sv=sFrom+(sTo-sFrom)*(1-Math.pow(1-k,3));
    g.clearRect(0,0,W,H);
    const tail=gold?'245,184,65':'76,141,255',head=gold?'#FFF1CC':'#E6F0FF';
    if(sv>.01){
      const speed=1+Math.max(0,sv-base)*7;g.font=fs+'px "Noto Sans Runic","Segoe UI Historic",sans-serif';g.textAlign='center';g.textBaseline='middle';
      for(const c of cols){
        c.y+=c.v*speed*dt;if(c.y-c.len*fs>H)Object.assign(c,mk(c.x),{y:-Math.random()*60});
        if(Math.random()<.08)c.ch[(Math.random()*c.len)|0]=rr();
        for(let i=0;i<c.len;i++){const y=c.y-i*fs;if(y<-fs||y>H+fs)continue;
          const a=Math.pow(1-i/c.len,1.6)*sv;if(a<.02)continue;
          if(i===0){g.fillStyle=head;g.globalAlpha=Math.min(1,a*1.4);g.fillText(RUNES[(c.ch[0]+((ts/70)|0))%24],c.x,y);}
          else{g.fillStyle='rgba('+tail+','+a.toFixed(3)+')';g.globalAlpha=1;g.fillText(RUNES[c.ch[i]],c.x,y);}
        }
      }
      g.globalAlpha=1;
    }
    if(pState)drawP(ts);
  }
  function drawP(ts){
    const cx=W/2,cy=H/2,R=Math.min(190,Math.min(W,H)*.42);const e=ts-pState.t0;
    g.font='18px "Noto Sans Runic","Segoe UI Historic",sans-serif';g.textAlign='center';g.textBaseline='middle';
    const col=gold?'#FFE7A8':'#BFD6FF',glow=gold?'#F5B841':'#4C8DFF';g.shadowColor=glow;g.shadowBlur=12;
    let alive=0;
    for(const p of P){
      let x,y,a=1;const ang=p.a+e/1000*1.6;
      if(pState.mode==='in'){const k=Math.max(0,Math.min(1,(e-p.delay)/pState.dur));const q=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
        const tx=cx+Math.cos(ang)*R*p.rf,ty=cy+Math.sin(ang)*R*p.rf;x=p.x+(tx-p.x)*q;y=p.y+(ty-p.y)*q;a=.35+.65*q;}
      else{const t=(ts-pState.tOut)/1000;const r=R*p.rf+t*(380+p.sp*520);x=cx+Math.cos(ang)*r;y=cy+Math.sin(ang)*r;a=Math.max(0,1-t*1.3);}
      if(a<=0)continue;alive++;g.globalAlpha=a;g.fillStyle=col;g.fillText(RUNES[p.c],x,y);
    }
    g.shadowBlur=0;g.globalAlpha=1;if(!alive&&pState.mode==='out')pState=null;
  }
  return {
    start(){if(running)return;running=true;size();last=0;requestAnimationFrame(frame);},
    stop(){running=false;P.length=0;pState=null;g.clearRect(0,0,W,H);},
    resize:size,
    surge(to,ms=500){sFrom=sv;sTo=to;sT0=performance.now();sDur=Math.max(1,ms);},
    setGold(v){gold=!!v;},
    converge(n=140,dur=900,spread=500){P.length=0;const now=performance.now();
      for(let i=0;i<n;i++){const c=cols[(Math.random()*cols.length)|0]||{x:W/2,y:0};P.push({x:c.x,y:Math.max(0,Math.min(H,c.y-Math.random()*200)),a:i/n*Math.PI*2,rf:.86+Math.random()*.28,c:rr(),delay:Math.random()*spread,sp:Math.random()});}
      pState={mode:'in',t0:now,dur};},
    explode(){if(pState){pState.mode='out';pState.tOut=performance.now();}}
  };
}
let bgRain=null,ovFx=null;
function decode(el,text,dur=650){
  if(!el)return;text=String(text);const t0=performance.now();el.classList.add('decoding');
  const step=now=>{const k=Math.min(1,(now-t0)/dur);const n=Math.floor(k*text.length);
    el.textContent=text.split('').map((c,i)=>i<n||c===' '?c:RUNES[(Math.random()*24)|0]).join('');
    if(k<1)requestAnimationFrame(step);else{el.textContent=text;el.classList.remove('decoding');}};
  requestAnimationFrame(step);
}

/* ============ UI feedback ============ */
function floater(main,sub){
  if(!main&&!sub)return;const f=document.createElement('div');f.className='floater';
  f.innerHTML=(main?'<b>'+esc(main)+'</b>':'')+(sub?'<span>'+esc(sub)+'</span>':'');
  for(let i=0;i<10;i++){const sp=document.createElement('i');sp.className='spark';sp.textContent=RUNES[(Math.random()*24)|0];const a=Math.random()*Math.PI*2,d=50+Math.random()*70;sp.style.setProperty('--dx',(Math.cos(a)*d).toFixed(0)+'px');sp.style.setProperty('--dy',(Math.sin(a)*d).toFixed(0)+'px');sp.style.animationDelay=(Math.random()*.15).toFixed(2)+'s';f.appendChild(sp);}
  $('#floaters').appendChild(f);setTimeout(()=>f.remove(),1800);
}
function toast(rune,title,body){
  const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');
  t.innerHTML='<span class="rune" aria-hidden="true">'+esc(rune)+'</span><div><b>'+esc(title)+'</b><small>'+esc(body)+'</small></div>';
  const box=$('#toast');box.appendChild(t);while(box.children.length>2)box.firstChild.remove();
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),400);},3600);
}
function queueOverlay(o){OQ.push(o);if(!ovOpen){ovOpen=true;setTimeout(nextOverlay,60);}}
let seqTimer=null;
function nextOverlay(){
  const ov=$('#ov');const o=OQ.shift();clearTimeout(seqTimer);
  if(!o){ov.hidden=true;ov.className='ov';ovOpen=false;if(ovFx)ovFx.stop();if(bgRain)bgRain.surge(.2,900);return;}
  ovOpen=true;ov.hidden=false;ov.className='ov';void ov.offsetWidth;
  const big=o.type==='level'||o.type==='rank'||o.type==='chapter';const gold=o.type==='rank'||o.type==='chapter';
  ov.classList.toggle('gold',gold);ov.classList.add('seq');
  const c=$('#ovCenter');const bursts='<span class="burst"></span><span class="burst"></span><span class="burst"></span>';
  const isRune=!!o.rune;
  if(o.type==='run'){c.innerHTML=bursts+'<canvas id="ovMap" width="200" height="130"></canvas>';
    $('#ovExtra').innerHTML='<div class="ovStats"><div><b>'+fmtDur(o.run.sec)+'</b><small>TIME</small></div><div><b>'+fmtPace(o.run.sec,o.run.km)+'</b><small>PACE /KM</small></div><div><b>'+fmtN(o.run.kcal)+'</b><small>KCAL</small></div></div>';}
  else{c.innerHTML=bursts+'<span class="core'+(isRune?' rune':'')+'"></span>';$('#ovExtra').innerHTML='';}
  $('#ovKicker').textContent=o.kicker;$('#ovBody').textContent=o.body;$('#ovTitle').textContent='';
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(ovFx&&!reduce){ovFx.setGold(gold);ovFx.start();ovFx.resize();ovFx.surge(big?1:.55,250);ovFx.converge(big?150:90,big?950:650,big?550:250);}
  if(bgRain&&!reduce)bgRain.surge(big?1:.5,300);
  seqTimer=setTimeout(()=>{
    ov.classList.add('reveal');if(ovFx){ovFx.explode();ovFx.surge(big?.22:.12,900);}
    if(bgRain)bgRain.surge(.35,900);
    if(o.type==='run')animateRoute($('#ovMap'),o.run.pts,1100,{small:true});
    else{const core=$('#ovCenter .core');if(core){if(isRune)core.textContent=o.rune;else decode(core,o.num,700);}}
    decode($('#ovTitle'),o.title,800);
    setTimeout(()=>$('#ovBtn').focus(),350);
  },reduce?0:big?1750:950);
}

let sheetOnClose=null,lastFocus=null;
function openSheet(title,html,{short=false,onMount,onClose}={}){
  lastFocus=document.activeElement;const sh=$('#sheet'),sc=$('#scrim');
  $('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;sh.classList.toggle('short',short);
  sh.hidden=false;sc.hidden=false;void sh.offsetWidth;sh.classList.add('open');sc.classList.add('open');
  sheetOnClose=onClose||null;if(onMount)onMount($('#sheetBody'));
  setTimeout(()=>{const f=$('#sheetBody input:not([type=hidden]),#sheetBody button');(f||$('#sheet .iconBtn')).focus({preventScroll:true});},350);
}
function closeSheet(){
  const sh=$('#sheet'),sc=$('#scrim');if(sh.hidden)return;sh.classList.remove('open');sc.classList.remove('open');
  setTimeout(()=>{sh.hidden=true;sc.hidden=true;},380);if(sheetOnClose){const f=sheetOnClose;sheetOnClose=null;f();}
  if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});
}

const RUN={mode:'idle',pts:[],cum:[0],start:0,elapsed:0,lastTick:0,watch:null,demo:null,raf:null,wake:null};
function drawRoute(cv,pts,{progress=1,head=false,thumb=false,small=false,t=0}={}){
  const dpr=Math.min(2,window.devicePixelRatio||1);const W=cv.clientWidth||cv.width,H=cv.clientHeight||cv.height;if(!W||!H)return;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  if(!thumb&&!small){g.strokeStyle='rgba(76,141,255,.07)';g.lineWidth=1;for(let x=0;x<W;x+=26){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,H);g.stroke();}for(let y=0;y<H;y+=26){g.beginPath();g.moveTo(0,y+.5);g.lineTo(W,y+.5);g.stroke();}}
  if(!pts||pts.length<2){if(!thumb&&!small){g.fillStyle='#5D6A85';g.font='13px IBM Plex Sans, sans-serif';g.textAlign='center';g.fillText(RUN.mode==='acquiring'?'Waiting for GPS signal':'Start a run to draw your route',W/2,H/2);}return;}
  const kx=Math.cos(pts[0][0]*Math.PI/180);const xy=pts.map(p=>[p[1]*kx,-p[0]]);
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;xy.forEach(([x,y])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);});
  const pd=thumb?7:small?10:34;const sc=Math.min((W-2*pd)/Math.max(maxX-minX,1e-6),(H-2*pd)/Math.max(maxY-minY,1e-6));
  const ox=(W-(maxX-minX)*sc)/2-minX*sc,oy=(H-(maxY-minY)*sc)/2-minY*sc;const P=xy.map(([x,y])=>[ox+x*sc,oy+y*sc]);
  const n=Math.max(2,Math.floor(progress*(P.length-1))+1);
  const path=()=>{g.beginPath();g.moveTo(P[0][0],P[0][1]);for(let i=1;i<n;i++)g.lineTo(P[i][0],P[i][1]);};
  g.lineJoin='round';g.lineCap='round';

  g.shadowColor='#4C8DFF';g.shadowBlur=thumb?4:14;g.strokeStyle='#8DB8FF';g.lineWidth=thumb?2:3.5;path();g.stroke();g.shadowBlur=0;
  if(thumb)return;

  if(!small){let acc=0,next=1;for(let i=1;i<n;i++){acc+=hav(pts[i-1],pts[i]);if(acc>=next){const p=P[i];g.beginPath();g.arc(p[0],p[1],8,0,Math.PI*2);g.fillStyle='#14234A';g.fill();g.strokeStyle='#F5B841';g.lineWidth=1.2;g.stroke();g.fillStyle='#F5B841';g.font='600 9px Chakra Petch, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(next,p[0],p[1]+.5);next++;}}}
  mark(P[0],'ᚠ',small?8:11);
  if(head){const p=P[n-1];const r=7+Math.sin(t/180)*2.5;g.beginPath();g.arc(p[0],p[1],r+8,0,Math.PI*2);g.fillStyle='rgba(76,141,255,.18)';g.fill();g.beginPath();g.arc(p[0],p[1],r,0,Math.PI*2);g.fillStyle='#fff';g.shadowColor='#4C8DFF';g.shadowBlur=18;g.fill();g.shadowBlur=0;}
  else if(progress>=1)mark(P[P.length-1],'ᛟ',small?8:11);
}

  $('#gpsMsg').hidden=true;

  let got=false;
  const fail=setTimeout(()=>{if(!got){stopWatch();RUN.mode='idle';renderRunCtrls();showSelectedRun(false);gpsBlocked('No location arrived within 12 seconds.');}},12000);

    A.orbit=cfg.glyphs.map((ch,i)=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:runeTex(ch,'#4C8DFF'),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));sp.scale.setScalar(.3);char.add(sp);const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex('#4C8DFF'),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.5}));gl.scale.setScalar(.45);sp.add(gl);gl.scale.setScalar(1.5);return {sp,ph:i/Math.max(1,cfg.glyphs.length)*Math.PI*2};});
    /* particles */
    const N=50+rank*12;const pg=new THREE.BufferGeometry();const pos=new Float32Array(N*3);A.pSpeed=new Float32Array(N);
    for(let i=0;i<N;i++){const a=Math.random()*Math.PI*2,r=.35+Math.random()*1.1;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=Math.random()*2.6;pos[i*3+2]=Math.sin(a)*r;A.pSpeed[i]=.15+Math.random()*.45;}
    pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
    A.parts=new THREE.Points(pg,new THREE.PointsMaterial({size:.06,map:glowTex('#8DB8FF'),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,color:0xffffff}));char.add(A.parts);
    /* rising runes */
    A.rise=[];for(let i=0;i<5+rank;i++){const ch=RUNES[(i*7)%24];const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:runeTex(ch,'#4C8DFF'),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:0}));sp.scale.setScalar(.16);char.add(sp);A.rise.push({sp,off:Math.random()*4,x:(Math.random()-.5)*2.2,z:(Math.random()-.5)*1.2});}
    const pc=document.createElement('canvas');pc.width=4;pc.height=128;const pg2=pc.getContext('2d');const lg=pg2.createLinearGradient(0,0,0,128);lg.addColorStop(0,'rgba(141,184,255,0)');lg.addColorStop(.6,'rgba(141,184,255,.5)');lg.addColorStop(1,'rgba(141,184,255,.95)');pg2.fillStyle=lg;pg2.fillRect(0,0,4,128);
    A.pillar=new THREE.Mesh(new THREE.CylinderGeometry(.62,.75,4.2,40,1,true),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(pc),transparent:true,opacity:0,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false}));A.pillar.position.y=2.1;char.add(A.pillar);
    A.riseT=0;A.hover=rank>=4;
  }
  function spike(parent,mat,len,rad,dir,base=.17,center=[0,0,0]){const d=new THREE.Vector3(...dir).normalize();const m=add(parent,new THREE.ConeGeometry(rad,len,8),mat,[center[0]+d.x*(base+len*.42),center[1]+d.y*(base+len*.42),center[2]+d.z*(base+len*.42)]);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d);return m;}
  function buildHair(head,av,M){
    const hm=M.hair;add(head,new THREE.SphereGeometry(.226,32,18,0,Math.PI*2,0,Math.PI*.56),hm,[0,.01,-.012],[-.65,0,0],[.97,1.03,1]);
    const bang=(x,dx,len=.13,rad=.05)=>spike(head,hm,len,rad,[dx,-1,.55],.0,[x,.15,.17]);
    if(av.hair==='spiky'){
      [[0,1,-.25,.3],[.5,.9,-.35,.27],[-.5,.9,-.35,.27],[.9,.45,-.3,.24],[-.9,.45,-.3,.24],[.3,.55,-.9,.28],[-.3,.55,-.9,.28],[0,.25,-1,.3],[.7,-.05,-.75,.22],[-.7,-.05,-.75,.22],[.2,.95,.3,.2],[-.25,.9,.25,.2]].forEach(([x,y,z,l])=>spike(head,hm,l,.075,[x,y,z]));
      bang(-.12,-.35);bang(-.04,-.1,.15);bang(.05,.15,.14);bang(.13,.4);}
    else if(av.hair==='swept'){
      [[0,.4,-1,.34],[.35,.35,-.9,.3],[-.35,.35,-.9,.3],[.15,.7,-.75,.3],[-.15,.7,-.75,.3],[.65,.15,-.8,.26],[-.65,.15,-.8,.26],[0,.85,-.4,.26]].forEach(([x,y,z,l])=>spike(head,hm,l,.08,[x,y,z]));
      spike(head,hm,.22,.06,[1,-.25,.45],.0,[.02,.17,.17]);spike(head,hm,.16,.05,[-.6,-.8,.5],.0,[-.08,.16,.17]);}
    else if(av.hair==='long'){
      add(head,new THREE.CapsuleGeometry(.17,.42,6,14),hm,[0,-.28,-.1],[.12,0,0],[1.18,1,.42]);
      for(const s of[-1,1])add(head,new THREE.CapsuleGeometry(.045,.28,4,10),hm,[s*.17,-.16,.07],[0,0,s*.08]);
      bang(-.1,-.25,.15);bang(-.02,-.05,.16);bang(.07,.2,.15);bang(.14,.45,.12);}
    else{
      bang(-.12,-.3);bang(-.03,-.05,.15);bang(.06,.2,.14);bang(.14,.45,.12);
      const tie=grp(head,[0,.17,-.2]);add(tie,new THREE.SphereGeometry(.045,12,10),M.acc,[0,0,0],[0,0,0],[1,1,1],null);
      const tail=grp(tie,[0,0,-.02],[.5,0,0]);add(tail,new THREE.CapsuleGeometry(.07,.42,6,12),hm,[0,-.26,-.02],[0,0,0],[1,1,.8]);spike(tail,hm,.16,.06,[0,-1,0],.0,[0,-.5,-.02]);A.tail=tail;}
    if(av.hair!=='pony')A.tail=null;
  }
  function buildGear(body,cfg,M,b){
    const rank=cfg.rank;const back=grp(body,[0,1.3,-.2*Math.sqrt(b)]);A.weapon=back;
    if(cfg.cls==='berserker'){const sw=grp(back,[0,0,-.02],[0,0,.55]);
      add(sw,new THREE.BoxGeometry(.11,.95,.025),rank>=2?toon('#DCE6F5',{emissive:'#4C8DFF',ei:.25}):M.metal,[0,.25,0]);
      add(sw,new THREE.BoxGeometry(.03,.85,.03),M.acc,[0,.27,.012],[0,0,0],[1,1,1],null);
      add(sw,new THREE.BoxGeometry(.3,.05,.07),M.dark,[0,-.24,0]);add(sw,new THREE.CylinderGeometry(.025,.025,.2,8),M.outD,[0,-.36,0]);add(sw,new THREE.SphereGeometry(.04,10,8),M.acc,[0,-.48,0],[0,0,0],[1,1,1],null);}
    else if(cfg.cls==='ranger'){const bw=grp(back,[0,0,-.03],[0,0,-.55]);
      add(bw,new THREE.TorusGeometry(.5,.02,6,30,Math.PI*.85),M.outD,[0,0,0],[0,0,Math.PI*.575]);
      add(bw,new THREE.CylinderGeometry(.004,.004,.96,4),M.acc,[-.04,0,0],[0,0,0],[1,1,1],null);
      const q=grp(back,[.12,-.05,-.02],[0,0,.3]);add(q,new THREE.CylinderGeometry(.06,.05,.42,12),M.dark,[0,0,0]);for(let i=0;i<3;i++)add(q,new THREE.ConeGeometry(.018,.06,6),M.acc,[(i-1)*.03,.26,0],[0,0,0],[1,1,1],null);}
    else if(cfg.cls==='paladin'){const sd=grp(back,[0,-.05,-.03]);
      add(sd,new THREE.CylinderGeometry(.3,.3,.04,28),M.out,[0,0,0],[Math.PI/2,0,0]);add(sd,new THREE.TorusGeometry(.3,.025,8,32),M.metal,[0,0,0],[0,0,0],[1,1,1],null);
      const rp=new THREE.Mesh(new THREE.PlaneGeometry(.32,.32),new THREE.MeshBasicMaterial({map:runeTex('ᛟ','#4C8DFF'),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));rp.position.z=-.025;rp.rotation.y=Math.PI;sd.add(rp);}
    else{const beads=grp(body,[0,1.02,0]);for(let i=0;i<14;i++){const a=i/14*Math.PI*2;add(beads,new THREE.SphereGeometry(.022,8,6),i%3?M.dark:M.acc,[Math.cos(a)*.24*b,0,Math.sin(a)*.17],[0,0,0],[1,1,1],null);}A.beads=beads;}
  }

  // The original procedural body is a fallback only. The new character is a
  // separate articulated glTF asset with independent class and rank equipment.
  let hunterTemplate=null,hunterLoading=false,hunterFailed=false;
  function applyHunterConfig(cfg){
    if(!A.hunter)return;
    A.hunter.traverse(obj=>{
      if(obj.name.startsWith('RANK_')){
        const required=Number(obj.name.split('_')[1]);
        obj.visible=required===cfg.rank;
      }else if(obj.name.startsWith('CLASS_')){
        obj.visible=obj.name.startsWith('CLASS_'+cfg.cls+'_');
      }
    });
    const mats=A.hunter.userData.mats||{};
    if(mats['Eye colour'])mats['Eye colour'].color.set(cfg.avatar.eyes);
    if(mats['Skin'])mats['Skin'].color.set(cfg.avatar.skin);
    if(mats['Dark hair'])mats['Dark hair'].color.set(cfg.avatar.hairColor);
    // Retain a mature shadow palette while honouring the saved outfit colour.
    if(mats['Accent electric blue'])mats['Accent electric blue'].color.set(cfg.avatar.outfitColor);
  }
  function attachHunter(cfg){
    if(!hunterTemplate||!char)return;
    const holder=char;
    const clone=hunterTemplate.clone(true);
    const materials={};
    clone.traverse(obj=>{
      if(obj.isMesh&&obj.material){
        obj.material=obj.material.clone();
        if(obj.material.name)materials[obj.material.name]=obj.material;
        obj.castShadow=true;
      }
    });
    clone.userData.mats=materials;
    clone.scale.setScalar(1);
    holder.add(clone);
    A.hunter=clone;
    A.hunterJoints={};
    clone.traverse(obj=>{if(obj.isObject3D&&obj.name)A.hunterJoints[obj.name]=obj;});
    // Keep the original magic circles, runes and environmental effects.
    // Hide only the obsolete capsule character and its attachments.
    A.body.visible=false;
    applyHunterConfig(cfg);
  }
  function loadHunter(cfg){
    if(hunterFailed)return;
    if(hunterTemplate){attachHunter(cfg);return;}
    if(hunterLoading)return;
    if(!THREE.GLTFLoader){hunterFailed=true;console.warn('Ascend model loader unavailable; retaining fallback');return;}
    hunterLoading=true;
    new THREE.GLTFLoader().load('assets/ascend-hunter.gltf',gltf=>{
      hunterLoading=false;
      hunterTemplate=gltf.scene;
      if(cfgNow&&char){attachHunter(cfgNow);}
    },undefined,e=>{
      hunterLoading=false;hunterFailed=true;
      console.warn('Ascend hunter asset unavailable; keeping existing character',e);
    });
  }
  function animateHunter(t,raise){
    const j=A.hunterJoints;if(!A.hunter||!j)return;
    const breathe=Math.sin(t*1.7);
    if(j.Spine)j.Spine.rotation.z=breathe*.008;
    if(j.Chest)j.Chest.rotation.x=breathe*.009;
    if(j.Head){j.Head.rotation.y=Math.sin(t*.65)*.075;j.Head.rotation.x=Math.sin(t*.82)*.025-raise*.1;}
    for(const side of[-1,1]){
      const a=j['UpperArm '+side],f=j['Forearm '+side],leg=j['UpperLeg '+side];
      if(a){a.rotation.z=side*(.07+Math.sin(t*1.25)*.018+raise*1.9);a.rotation.x=Math.sin(t*1.35+side)*.022;}
      if(f)f.rotation.x=-.13+raise*.25;
      if(leg)leg.rotation.x=Math.sin(t*1.3+side)*.012;
    }
    if(j.Hips)j.Hips.position.y=1.08+Math.sin(t*1.7)*.008+raise*.13;
  }
  function set(cfg){cfgNow=cfg;if(!ok)return;const s=JSON.stringify(cfg);if(s===sig)return;sig=s;build(cfg);loadHunter(cfg);}
  function celebrateNow(){celebrate=1.8;}
  function loop(){
    requestAnimationFrame(loop);if(!ok||!isActive||document.hidden||!char)return;
    const t=now();const dt=Math.min(.05,t-(loop.last||t));loop.last=t;
    if(!dragging){rot+=rotVel;rotVel*=.93;if(t-lastTouch>3.5){const target=Math.round(rot/(Math.PI*2))*Math.PI*2+Math.sin(t*.35)*.38;rot+=(target-rot)*.02;}}
    let spin=0,jump=0,raise=0;if(celebrate>0){celebrate-=dt;const p=1-celebrate/1.8;spin=Math.sin(Math.min(1,p*1.3)*Math.PI/2)*Math.PI*2;jump=Math.sin(Math.min(1,p*1.6)*Math.PI)*.35;raise=Math.sin(Math.min(1,p*1.25)*Math.PI);}
    root.rotation.y=rot+spin;
    const hov=A.hover?.12+Math.sin(t*1.5)*.05:Math.sin(t*2)*.006;A.body.position.y=hov+jump;
    if(A.shadow){const k=1-(hov+jump)*.6;A.shadow.scale.setScalar(Math.max(.4,k));}
    A.torso.scale.y=1+Math.sin(t*2)*.012;A.chest.scale.z=.8*Math.sqrt(A.bulk)*(1+Math.sin(t*2)*.03);
    A.head.rotation.y=Math.sin(t*.7)*.09;A.head.rotation.x=Math.sin(t*1.1)*.03-raise*.15;A.head.position.y=1.86+Math.sin(t*2)*.006;
    A.arms.forEach(({sh,fo,s})=>{sh.rotation.z=s*(.14+Math.sin(t*1.6)*.025+raise*2.5);sh.rotation.x=Math.sin(t*1.6+s)*.06;fo.rotation.x=-.12-Math.sin(t*1.6)*.05-raise*.3;});
    if(A.tail){A.tail.rotation.z=Math.sin(t*2.2)*.16;A.tail.rotation.x=.5+Math.sin(t*1.7)*.08;}
    const blink=(t%4.2)>4.05?.12:1;A.eyes.forEach(e=>e.scale.y=blink);
    if(A.cape){const pa=A.cape.geometry.attributes.position,bs=A.capeBase;for(let i=0;i<pa.count;i++){const y=bs[i*3+1];const f=-y/.95;pa.array[i*3+2]=bs[i*3+2]-f*f*(.12+Math.sin(t*2.4+y*5+bs[i*3]*3)*.05)-raise*f*.2;}pa.needsUpdate=true;A.cape.geometry.computeVertexNormals();}
    A.wings.forEach(({piv,s})=>{piv.rotation.y=s*(-.55+Math.sin(t*2.6)*.22);piv.rotation.z=s*Math.sin(t*2.6)*.06;});
    if(A.halo){A.halo.rotation.y=t*.8;}
    if(A.beads)A.beads.rotation.y=t*.6;
    if(A.chestGlyph)A.chestGlyph.material.opacity=.6+Math.sin(t*3)*.4;
    A.ringA.rotation.z=t*.18;A.ringB.rotation.z=-t*.3;
    A.aura.scale.setScalar((2.4+A.rank*.22)*(1+Math.sin(t*1.6)*.05)+raise*.8);
    A.orbit.forEach((o,i)=>{const a=t*.9+o.ph;o.sp.position.set(Math.cos(a)*.78,1.25+Math.sin(t*1.3+i)*.12+A.body.position.y,Math.sin(a)*.78);});
    const pa=A.parts.geometry.attributes.position;for(let i=0;i<pa.count;i++){let y=pa.array[i*3+1]+A.pSpeed[i]*dt*(1+raise*4);if(y>2.7)y=0;pa.array[i*3+1]=y;}pa.needsUpdate=true;
    A.riseT+=dt*(.28+raise*2.2);A.pillar.material.opacity=raise*.55;A.pillar.rotation.y=t*2;A.pillar.scale.set(1-raise*.2,1,1-raise*.2);
    A.rise.forEach(r=>{const p=((A.riseT+r.off)%2)/2;r.sp.position.set(r.x,.1+p*2.4,r.z);r.sp.material.opacity=Math.sin(p*Math.PI)*.85;});
    animateHunter(t,raise);
    renderer.render(scene,camera);
  }
  return {init,set,celebrate:celebrateNow,active:v=>{isActive=v;}};
})();

/* ============ events ============ */
const ACT={
  tab:b=>switchTab(b.dataset.tab),
  glyphTab:()=>switchTab('glyphs'),
  customise:sheetCustomise,profile:sheetProfile,achievements:sheetAchievements,ranks:sheetRanks,notifs:sheetNotifs,
  settings:()=>{if(!$('#sheet').hidden){closeSheet();setTimeout(sheetSettings,400);}else sheetSettings();},
  closeSheet,
  addStat:b=>{const k=b.dataset.k;if(S.points<1)return;S.points--;S.stats[k]++;floater('',STAT[k].k+' +1');commit();},
  logWorkout:()=>sheetWorkout('log'),newQuest:()=>sheetWorkout('quest'),
  claim:b=>{const q=dailyQuests().concat(weeklyQuests()).find(x=>x.key===b.dataset.key);if(q)claimQuest(q);},
  claimChapter,
  customDo:b=>completeCustom(b.dataset.id),
  customDel:b=>{S.customQuests=S.customQuests.filter(q=>q.id!==b.dataset.id);commit();},
  addMeal:sheetMeal,
  favAdd:b=>{const f=S.favs[+b.dataset.i];if(!f)return;const h=new Date().getHours();addMeal({name:f.name,slot:h<10?'Breakfast':h<15?'Lunch':h<21?'Dinner':'Snack',kcal:f.kcal,p:f.p,c:f.c,f:f.f});},
  mealDel:b=>{S.meals=S.meals.filter(m=>m.id!==b.dataset.id);commit();},
  awaken:b=>awaken(b.dataset.id),equip:b=>toggleEquip(b.dataset.id),
  runStart:startLive,runDemo:startDemo,gpx:()=>$('#gpxIn').click(),gpsHide:()=>{$('#gpsMsg').hidden=true;},
  runCancel:()=>{stopWatch();RUN.mode='idle';renderRunCtrls();showSelectedRun(false);},
  runPause:()=>{RUN.prevMode=RUN.mode;RUN.mode='paused';renderRunCtrls();},
  runResume:()=>{RUN.mode=RUN.prevMode||'live';RUN.lastTick=performance.now();renderRunCtrls();cancelAnimationFrame(RUN.raf);RUN.raf=requestAnimationFrame(tickRun);},
  runFinish:()=>{if(RUN.mode==='paused'&&RUN.prevMode==='demo')RUN.mode='demo';finishLive();},
  viewRun:b=>{if(RUN.mode!=='idle')return;viewRunId=b.dataset.id;$$('.runCard').forEach(c=>c.classList.toggle('sel',c.dataset.id===viewRunId));showSelectedRun(true);$('#main').scrollTo({top:0,behavior:'smooth'});},
  ovNext:()=>nextOverlay(),
  keepSample:()=>{S.sample=false;commit();},
  resetAsk:b=>{
    if(b.dataset.confirm){const keep={profile:S.profile,avatar:S.avatar,settings:S.settings,notifs:[]};S=Object.assign(blank(),keep);S.notifs=[];notify('ᚠ','Your ascent begins','Level 1. Log a workout, a run or a meal to earn XP.',false);closeSheet();commit();if(tab!=='hero')switchTab('hero');setTimeout(sheetProfile,450);return;}
    b.dataset.confirm='1';b.textContent='Tap again to erase sample progress';b.classList.add('pri');b.classList.remove('ghost');setTimeout(()=>{if(b.isConnected){delete b.dataset.confirm;b.textContent=b.closest('.sample')?'Start fresh':'Start fresh at level 1';b.classList.toggle('pri',!!b.closest('.sample'));b.classList.toggle('ghost',!b.closest('.sample'));}},4000);},
  demoLevel:()=>award({xp:need(S.level)-S.xp,quiet:true}),
  demoRank:()=>{const nt=TIERS[rankIdx(S.level)+1];if(!nt)return;let x=need(S.level)-S.xp;for(let l=S.level+1;l<nt.min;l++)x+=need(l);award({xp:x,quiet:true});},
  demoShards:()=>award({shards:{str:10,end:10,agi:10,vit:10}})
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.disabled)return;const f=ACT[a.dataset.act];if(f){e.preventDefault();f(a,e);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#ov').hidden)nextOverlay();else closeSheet();}
  const sb=e.target.closest&&e.target.closest('[data-hold="sigil"]');if(sb&&(e.key==='Enter'||e.key===' ')){e.preventDefault();if(S.sigilDay!==dayKey())igniteSigil();}
});
$('#gpxIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)importGpx(f);e.target.value='';});
/* hold to ignite */
let holdRaf=null,holdStart=0;
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-hold="sigil"]');if(!b||S.sigilDay===dayKey())return;e.preventDefault();holdStart=performance.now();b.classList.add('charging');const pr=$('#sigilProg');const C=2*Math.PI*86;pr.style.transition='none';
  const step=()=>{const p=Math.min(1,(performance.now()-holdStart)/1400);pr.style.strokeDashoffset=String(C*(1-p));if(p>=1){b.classList.remove('charging');b.classList.add('lit');holdRaf=null;igniteSigil();return;}holdRaf=requestAnimationFrame(step);};holdRaf=requestAnimationFrame(step);});
const holdEnd=()=>{if(!holdRaf)return;cancelAnimationFrame(holdRaf);holdRaf=null;const b=$('[data-hold="sigil"]');if(b)b.classList.remove('charging');const pr=$('#sigilProg');if(pr){pr.style.transition='stroke-dashoffset .4s';pr.style.strokeDashoffset=String(2*Math.PI*86);}};
document.addEventListener('pointerup',holdEnd);document.addEventListener('pointercancel',holdEnd);

/* ============ boot ============ */
(function boot(){
  bgRain=makeRain($('#rain'),{base:.2,fs:16});ovFx=makeRain($('#ovFx'),{base:0,fs:18});
  if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))bgRain.start();
  window.addEventListener('resize',()=>{bgRain.resize();if(ovOpen&&ovFx)ovFx.resize();});
  if(document.fonts&&document.fonts.load)document.fonts.load('16px "Noto Sans Runic"').catch(()=>{});
  S=migrate(loadLocal()||seed());dayRollover();
  Hero3D.init($('#stage3d'));
  renderAll();
  setInterval(()=>{checkReminders();if(tab==='quests'&&$('#sheet').hidden&&ovOpen===false)renderQuests();},60000);
  setTimeout(checkReminders,4000);
  connectCloud();
  window.addEventListener('resize',()=>{if(tab==='run'&&RUN.mode==='idle')showSelectedRun(false);});
})();
</script>
